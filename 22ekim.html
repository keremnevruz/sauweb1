<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form elemanları sayfası</title>
</head>
<body>
    <h1>Form elemanları sayfası</h1>

    <form action="deneme.html" method="get">
        <label for="name">Adınız:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">E-posta:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="message">Mesajınız:</label><br>
        <textarea id="message" name="message" rows="4" cols="50" required></textarea><br><br>


        <input type="checkbox" id="checkbox" name="checkbox" value="Evet">
        <label for="checkbox">Bultene Abone Ol</label><br><br>

        <input type="radio" id="option1" name="options" value="Seçenek 1">
        <label for="option1">Seçenek 1</label><br>
        <input type="radio" id="option2" name="options" value="Seçenek 2">
        <label for="option2">Seçenek 2</label><br><br>

        <input type="radio" id="option3" name="options" value="Seçenek 3">
        <label for="option3">Seçenek 3</label><br>
        <input type="radio" id="option4" name="options" value="Seçenek 4">
        <label for="option4">Seçenek 4</label><br><br>

        <label for="dob">Doğum Tarihiniz:</label>
        <input type="date" id="dob" name="dob"><br><br>

        <input type="color" id="color" name="color"><br><br>

        <input type="submit" value="Gönder"><br><br>
    </form>
</body>
</html>
